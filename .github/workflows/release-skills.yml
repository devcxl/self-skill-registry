name: Release Skills

# Push to main → publish skills to R2/D1 staging
# Tag v* → publish to production
#
# ⚠️  Worker deploy is handled by release-worker.yml.
# ⚠️  CLI publish is handled by release-cli.yml.

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'packages/registry-core/**'
      - 'scripts/**'
      - 'db/**'

permissions:
  contents: read
  deployments: write

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate skills
        run: npm run validate:skills

      - name: Build registry metadata
        run: npm run build:registry -- --source-commit "$GITHUB_SHA"

      - name: Pack skills into tarballs
        run: npm run pack:skills

      - name: Publish to R2 (staging)
        run: npm run publish:r2 -- --staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Import to D1 (staging)
        run: npm run import:registry -- --remote --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  production:
    runs-on: ubuntu-latest
    environment: production
    needs: staging
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build registry metadata
        run: npm run build:registry -- --source-commit "$GITHUB_SHA"

      - name: Pack skills into tarballs
        run: npm run pack:skills

      - name: Publish to R2 (production)
        run: npm run publish:r2 -- --production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Import to D1 (production)
        run: npm run import:registry -- --remote --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
