name: Validate

# Run on PRs (excluding docs-only changes)
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate skills
        run: npm run validate:skills

      - name: Build registry
        run: npm run build:registry

      - name: Pack skills
        run: npm run pack:skills

      - name: Dry-run D1 import
        run: npm run import:registry -- --dry-run

      - name: Dry-run R2 publish
        run: npm run publish:r2 -- --dry-run
