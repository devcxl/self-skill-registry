name: Skill Review

# Trigger: PRs that modify skills/ directory, SKILL.md, or related files
on:
  pull_request:
    paths:
      - 'skills/**'
      - '.opencode/skills/skill-evaluator/**'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history so git diff can reference base branch
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Find changed skill (must be exactly one)
        run: |
          # tail -n 1: the script prints diagnostics to stderr, but this
          # guards against future stdout pollution breaking $GITHUB_ENV.
          SKILL=$(bash scripts/find-changed-skills.sh "${{ github.base_ref }}" | tail -n 1)
          echo "SKILL=$SKILL" >> "$GITHUB_ENV"

      - name: Run TS pre-check (validate + security)
        run: |
          npx tsx scripts/validate-skills.ts
          npx tsx scripts/build-registry.ts
          npx tsx scripts/pack-skills.ts

      - name: Run tests
        run: npm test

      - name: Configure git identity (for OpenCode)
        run: |
          git config user.name "skill-review[bot]"
          git config user.email "skill-review[bot]@users.noreply.github.com"

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run AI review (OpenCode)
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review the skill that was changed in this PR.
            Follow .opencode/skills/skill-evaluator/SKILL.md instructions.
            Produce:
            1. skills/<skill-name>/EVAL.md
            2. artifacts/skill-review.json
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify review artifacts (EVAL.md + skill-review.json + schema)
        run: npx tsx scripts/verify-review-artifacts.ts "$SKILL"

      - name: Check review status
        id: check-status
        run: |
          STATUS=$(npx tsx scripts/check-review-status.ts artifacts/skill-review.json)
          echo "Review status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "rejected" ]; then
            echo "❌ Skill rejected by AI review. See EVAL.md for details."
            exit 1
          fi

          if [ "$STATUS" = "needs_manual_review" ]; then
            echo "⚠️  Skill requires manual review. An admin must approve before publishing."
            # Soft fail — blocks merge but doesn't fail the workflow
            # (hard fail only for rejected)
          fi

      - name: Sync structured review into EVAL.md front matter
        if: steps.check-status.outputs.status != 'rejected'
        run: |
          npx tsx scripts/sync-review-frontmatter.ts "skills/${SKILL}/EVAL.md" artifacts/skill-review.json

      - name: Commit EVAL artifacts to PR
        run: |
          EVAL_PATH="skills/${SKILL}/EVAL.md"

          if [ ! -f "$EVAL_PATH" ]; then
            echo "❌ Missing EVAL.md at $EVAL_PATH"
            exit 1
          fi

          git config user.name "devcxl"
          git config user.email "64475363+devcxl@users.noreply.github.com"

          git add "$EVAL_PATH"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add AI review evaluation for ${SKILL} [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "✅ EVAL.md committed to PR branch with synced front matter"
          fi

      - name: Post review status comment
        if: always()
        run: npx tsx scripts/post-review-comment.ts
        env:
          REVIEW_STATUS: ${{ steps.check-status.outputs.status }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
